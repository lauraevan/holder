name: Inspect profile menu reference
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/inspect_profile_reference.py'
      - '.github/workflows/inspect-profile-reference.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect standalone builds
        run: python3 tools/inspect_profile_reference.py > preview/26.3-asset-swap/profile-reference-report.txt
      - name: Commit report
        run: |
          git config user.name 'profile-inspect-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add preview/26.3-asset-swap/profile-reference-report.txt
          git diff --cached --quiet || git commit -m 'Inspect native Edit Profile menu reference'
          git push
