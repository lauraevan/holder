name: Build world-list fixed client
on:
  push:
    paths:
      - 'tools/patch_empty_world_list.py'
      - '.github/workflows/build-world-list-fixed-client.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          set -euo pipefail
          python3 -m pip install --quiet brotli
          curl -fL --retry 5 https://github.com/bytecodealliance/wasm-tools/releases/download/v1.219.1/wasm-tools-1.219.1-x86_64-linux.tar.gz -o /tmp/wasm-tools.tgz
          tar xzf /tmp/wasm-tools.tgz -C /tmp
          sudo cp /tmp/wasm-tools-1.219.1-x86_64-linux/wasm-tools /usr/local/bin/wasm-tools
      - name: Download canonical 26.2 client image
        run: |
          set -euo pipefail
          curl -fL --retry 5 https://raw.githubusercontent.com/Enchantment-Niko/mcjs/bc586558628e2d7ef8ea1cebf198495625619eb2/wasm-loader/26.2/eag26.2-wasm-br.wasm -o /tmp/client.br
          python3 - <<'PY'
          import brotli
          raw=brotli.decompress(open('/tmp/client.br','rb').read())
          open('/tmp/classes.wasm','wb').write(raw)
          print("decoded",len(raw))
          PY
      - name: Patch empty-world branch
        run: |
          set -euo pipefail
          python3 tools/patch_empty_world_list.py \
            /tmp/classes.wasm \
            /tmp/classes-worldlist-fixed.wasm \
            preview/26.3-asset-swap/eag26.2-wasm-worldlist-fix-br.wasm \
            preview/26.3-asset-swap/world-list-patch-report.json
      - name: Validate patched Wasm
        run: |
          set -euo pipefail
          wasm-tools validate /tmp/classes-worldlist-fixed.wasm
          echo "Wasm validation passed"
      - name: Commit patched image
        run: |
          set -euo pipefail
          git config user.name 'world-list-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add preview/26.3-asset-swap/eag26.2-wasm-worldlist-fix-br.wasm preview/26.3-asset-swap/world-list-patch-report.json
          git diff --cached --quiet || git commit -m 'Patch empty Singleplayer list to stay on Select World'
          git pull --rebase origin main
          git push
