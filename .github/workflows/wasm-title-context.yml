name: Inspect WASM title string context
on:
  push:
    paths:
      - 'tools/wasm_title_context.py'
      - '.github/workflows/wasm-title-context.yml'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet brotli
      - run: |
          curl -fL 'https://raw.githubusercontent.com/Enchantment-Niko/mcjs/bc586558628e2d7ef8ea1cebf198495625619eb2/wasm-loader/26.2/eag26.2-wasm-br.wasm' -o /tmp/classes.br
          python3 tools/wasm_title_context.py /tmp/classes.br preview/26.3-asset-swap/wasm-title-context.txt
      - run: |
          git config user.name 'testbuild-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add preview/26.3-asset-swap/wasm-title-context.txt
          git diff --cached --quiet || git commit -m 'Inspect title string context'
          git push
