name: Inventory 26.3 languages
on:
  push:
    paths:
      - 'tools/list_epk_langs.py'
      - '.github/workflows/list-epk-langs.yml'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 tools/list_epk_langs.py preview/26.3-asset-swap/eag26.3-assets-en-v1.epk preview/26.3-asset-swap/language-files.txt
      - run: |
          git config user.name 'testbuild-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add preview/26.3-asset-swap/language-files.txt
          git diff --cached --quiet || git commit -m 'Inventory 26.3 language resources'
          git push
